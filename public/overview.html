<div class="overview">
    <h1 style="font-size:28px;margin-bottom:24px;">📊 Dashboard Overview</h1>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;">
        <div class="stat-card">
            <div class="stat-label">Uptime</div>
            <div class="stat-value">{{uptime}}</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">CPU Usage</div>
            <div class="stat-value">{{cpu_percent}}%</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Memory</div>
            <div class="stat-value">{{memory_used}}MB / {{memory_total}}MB ({{memory_percent}}%)</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Loaded Modules</div>
            <div class="stat-value">{{module_count}}</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Platform</div>
            <div class="stat-value">{{platform}}</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Python</div>
            <div class="stat-value">{{python_version}}</div>
        </div>
    </div>
    <style>
        .stat-card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:20px; }
        .stat-label { font-size:12px; color:#8b949e; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
        .stat-value { font-size:24px; font-weight:700; color:#58a6ff; }
    </style>
</div>
