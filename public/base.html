<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurupUserbot - {{page}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        nav { background: #161b22; border-bottom: 1px solid #30363d; padding: 0 20px; display: flex; align-items: center; height: 60px; }
        nav a { color: #8b949e; text-decoration: none; margin-right: 24px; font-size: 14px; }
        nav a:hover { color: #f0f6fc; }
        nav a.active { color: #f0f6fc; font-weight: 600; }
        .brand { font-weight: 700; font-size: 18px; color: #58a6ff; margin-right: 32px; }
        {% if message %}
        .alert { padding: 12px 20px; border-radius: 6px; margin-bottom: 20px; }
        .alert-success { background: #0d332b; color: #3fb950; border: 1px solid #3fb95040; }
        .alert-error { background: #3d1f1f; color: #f85149; border: 1px solid #f8514940; }
        {% end %}
    </style>
</head>
<body>
    <nav>
        <span class="brand">🤖 KurupUserbot</span>
        <a href="/" class="{{ 'active' if page == 'overview' else '' }}">Overview</a>
        <a href="/modules" class="{{ 'active' if page == 'modules' else '' }}">Modules</a>
        <a href="/logs" class="{{ 'active' if page == 'logs' else '' }}">Logs</a>
    </nav>
    <div class="container">
        {{!base}}
    </div>
</body>
</html>
